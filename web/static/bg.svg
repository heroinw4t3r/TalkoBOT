<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C4DFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#B388FF" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="r1" cx="80%" cy="-10%" r="60%">
      <stop offset="0%" stop-color="#B388FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="r2" cx="-10%" cy="110%" r="70%">
      <stop offset="0%" stop-color="#7C4DFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.06"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect width="100%" height="100%" fill="url(#r1)"/>
  <rect width="100%" height="100%" fill="url(#r2)"/>
  <g opacity="0.28">
    <circle cx="150" cy="200" r="220" fill="url(#g1)"/>
    <circle cx="1680" cy="220" r="280" fill="url(#g1)"/>
    <circle cx="300" cy="980" r="260" fill="url(#g1)"/>
    <circle cx="1620" cy="920" r="220" fill="url(#g1)"/>
  </g>
  <rect width="100%" height="100%" filter="url(#grain)" opacity="0.15"/>
  <text x="60" y="100" fill="#2a1d64" opacity="0.08" font-size="64" font-family="Inter, Arial, sans-serif">Talko Study Buddies</text>
</svg>



<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Talko — Вход</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --violet:#7C4DFF; --violet2:#B388FF; --bg:#ffffff; --text:#1f1739; --glass:rgba(255,255,255,.7) }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background: var(--bg) url('/static/bg.svg') no-repeat center/cover fixed;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}
    .card{width:100%;max-width:460px;background:var(--glass);backdrop-filter:saturate(140%) blur(10px);border:1px solid rgba(124,77,255,0.18);border-radius:20px;
      box-shadow:0 24px 55px rgba(124,77,255,0.18);padding:28px}
    h1{margin:0 0 8px;font-size:22px}
    p{margin:0 0 18px;color:#555}
    form{display:flex;gap:12px}
    input[type=password]{flex:1;padding:12px 14px;border:1px solid #e6e6f3;border-radius:12px;font-size:16px;outline:none}
    button{background:linear-gradient(135deg,var(--violet),var(--violet2));color:#fff;border:none;border-radius:12px;
      padding:12px 16px;font-size:16px;cursor:pointer;transition:transform .06s ease}
    button:active{transform:translateY(1px)}
    .error{margin-top:12px;color:#b00020}
    .page{opacity:0; transform: translateY(6px); transition: opacity .35s cubic-bezier(.2,.8,.2,1), transform .35s cubic-bezier(.2,.8,.2,1)}
    .page.ready{opacity:1; transform:none}
  </style>
</head>
<body>
  <div id="page" class="page card">
    <h1>Вход</h1>
    <p>Введите пароль для доступа</p>
    <form method="post" action="/login">
      <input type="password" name="password" placeholder="Пароль" required autofocus />
      <button type="submit">Войти</button>
    </form>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
  </div>
  <script>
    requestAnimationFrame(()=> document.getElementById('page').classList.add('ready'));
  </script>
</body>
</html>
